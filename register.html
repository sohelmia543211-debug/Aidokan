<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asol Nokol - Registration</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="register-card">
        <div class="logo">
            <i class="fa-solid fa-shield-halved glow-icon"></i> Asol<span>Nokol</span>
        </div>
        <h2>Account Toiri Korun</h2>
        <p class="sub-text" id="stepSubText">Step 1: Apnar totto gulo puron korun</p>

        <!-- Progress Indicator -->
        <div class="step-indicator">
            <div class="step-dot active" id="dot1">1</div>
            <div class="step-line" id="stepLine"></div>
            <div class="step-dot" id="dot2">2</div>
        </div>

        <form id="registerForm" onsubmit="return false;">
            
            <!-- STEP 1: Basic Information -->
            <div id="step1">
                <div class="form-group">
                    <label><i class="fa-solid fa-layer-group"></i> Main Category *</label>
                    <select id="mainCategory" onchange="loadSubCategories()" required>
                        <option value="">-- Select Korun --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-list-check"></i> Sub Category *</label>
                    <select id="subCategory" required disabled>
                        <option value="">-- Prothome Main Category Select Korun --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> Full Name *</label>
                    <input type="text" id="fullName" placeholder="Apnar puron nam likhun" required>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-envelope"></i> Email Address *</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-phone"></i> Mobile Number *</label>
                    <input type="tel" id="phoneNumber" placeholder="017XXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-lock"></i> Password *</label>
                    <input type="password" id="password" placeholder="Atleast 6 digit password" minlength="6" required>
                </div>

                <button type="button" class="btn-submit" onclick="goToStep2()">
                    Nijer Dhap (OTP Pathan) <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- STEP 2: OTP Verification -->
            <div id="step2" class="hidden">
                <div class="otp-info">
                    <i class="fa-solid fa-mobile-screen-button otp-icon"></i>
                    <p><b id="displayPhone">017XXXXXXXX</b>-e ekta OTP pathano hoyeche.</p>
                    <small>(Test Code: <b>1234</b>)</small>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-key"></i> 4-Digit OTP Code *</label>
                    <input type="text" id="otpCode" placeholder="1234" maxlength="4" required>
                    <small id="otpMessage"></small>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn-back" onclick="goToStep1()">
                        <i class="fa-solid fa-arrow-left"></i> Piche
                    </button>
                    <button type="button" id="submitBtn" class="btn-submit" onclick="verifyAndSubmit()">
                        <i class="fa-solid fa-check-circle"></i> Verify & Submit
                    </button>
                </div>
            </div>

        </form>

        <p class="login-link">
            Ager thekei account ache? <a href="login.html">Login Korun</a>
        </p>
    </div>

    <script src="register.js"></script>
</body>
</html>
