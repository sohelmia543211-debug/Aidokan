<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dokan - 2050 Futuristic Edition</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div>
            <h2>⚡ AI DOKAN // 2050 NEURAL NEXUS</h2>
            <p>Autonomous Quantum E-Commerce Intelligence</p>
        </div>
        <button id="voiceToggleBtn" class="voice-control" onclick="toggleVoice()">🔊 রিয়েল-টাইম ভয়েস: অন</button>
    </header>

    <div id="chat-container">
        <div class="message ai-message">
            আসসালামু আলাইকুম শোহেল ভাই! বলুন কেমন আছেন? আজকে আমাদের শপে কী ধরনের জিনিসপত্র লাগবে আপনার বলুন, একদম সেরা কালেকশনগুলো দেখিয়ে দিচ্ছি! 😊
        </div>
    </div>

    <div id="input-container">
        <!-- ভয়েস ইনপুট বাটন -->
        <button id="mic-btn" class="mic-btn" onclick="startVoiceRecognition()" title="কথা বলুন">🎙️</button>
        <input type="text" id="user-input" placeholder="আপনার পণ্যের নাম লিখুন বা মাইকে বলুন..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">প্রেরণ করুন</button>
    </div>

    <!-- Custom JS File with Module Support -->
    <script type="module" src="script.js"></script>
</body>
</html>
